name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: write
  # id-token: write is required for cosign keyless signing via Sigstore +
  # GitHub OIDC. The token never leaves the runner.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum

      # cosign signs the checksums.txt produced by GoReleaser. Pinned
      # to a specific release for reproducibility; bump via Dependabot.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      # syft generates SPDX SBOMs that GoReleaser attaches to each archive.
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.17.8

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
